<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audit Tool — Маркетинговый аудит сайтов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .optional-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .optional-inputs {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .summary h2 {
            margin-bottom: 15px;
        }

        .issue {
            background: #f8f9fa;
            border-left: 4px solid #dc3545;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .issue.warning {
            border-left-color: #ffc107;
        }

        .issue.info {
            border-left-color: #17a2b8;
        }

        .issue h3 {
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .severity {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity.high {
            background: #dc3545;
            color: white;
        }

        .severity.medium {
            background: #ffc107;
            color: #333;
        }

        .severity.low {
            background: #17a2b8;
            color: white;
        }

        .issue p {
            margin-bottom: 10px;
            line-height: 1.6;
            color: #555;
        }

        .issue .impact {
            font-weight: 600;
            color: #dc3545;
        }

        .issue .recommendation {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .report-btn {
            background: #28a745;
            margin-top: 20px;
        }

        .report-btn:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .financial-impact {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .financial-impact h3 {
            color: #856404;
            margin-bottom: 15px;
        }

        .financial-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI Audit Tool</h1>
            <p>Маркетинговый аудит сайтов с расчётом финансовых потерь</p>
        </div>

        <div class="card">
            <div class="input-group">
                <label for="urlInput">🌐 URL сайта для проверки</label>
                <input
                    type="text"
                    id="urlInput"
                    placeholder="https://example.com или example.com"
                    value="">
            </div>

            <div class="optional-inputs">
                <div class="input-group">
                    <label for="trafficInput">📊 Трафик (посетителей/месяц, опционально)</label>
                    <input
                        type="number"
                        id="trafficInput"
                        placeholder="Например: 10000"
                        value="">
                </div>

                <div class="input-group">
                    <label for="avgCheckInput">💰 Средний чек (₽, опционально)</label>
                    <input
                        type="number"
                        id="avgCheckInput"
                        placeholder="Например: 5000"
                        value="">
                </div>
            </div>

            <button class="btn" id="analyzeBtn" onclick="analyzeWebsite()">
                🔍 Проверить сайт
            </button>

            <div class="error" id="errorBlock"></div>
        </div>

        <div class="loading" id="loadingBlock">
            <div class="spinner"></div>
            <p id="loadingText">Загружаю страницу...</p>
        </div>

        <div class="results" id="resultsBlock">
            <div class="card">
                <div class="summary" id="summaryBlock"></div>

                <div id="financialImpactBlock"></div>

                <div id="issuesBlock"></div>

                <button class="btn report-btn" onclick="generateReport()">
                    📄 Сформировать отчёт для клиента
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentAnalysis = null;
        let currentUrl = '';
        let currentTraffic = 0;
        let currentAvgCheck = 0;

        async function analyzeWebsite() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const trafficInput = document.getElementById('trafficInput').value;
            const avgCheckInput = document.getElementById('avgCheckInput').value;

            // Валидация
            if (!urlInput) {
                showError('Пожалуйста, введите URL сайта');
                return;
            }

            // Нормализация URL
            let url = urlInput;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            currentUrl = url;
            currentTraffic = trafficInput ? parseInt(trafficInput) : 0;
            currentAvgCheck = avgCheckInput ? parseInt(avgCheckInput) : 0;

            // Скрываем результаты и ошибки
            hideError();
            document.getElementById('resultsBlock').classList.remove('active');

            // Показываем загрузку
            const loadingBlock = document.getElementById('loadingBlock');
            const loadingText = document.getElementById('loadingText');
            loadingBlock.classList.add('active');
            loadingText.textContent = 'Загружаю страницу...';

            // Блокируем кнопку
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;

            try {
                // Шаг 1: Парсинг страницы
                loadingText.textContent = 'Загружаю и парсю страницу...';
                const pageContent = await fetchPageContent(url);

                // Шаг 2: Анализ через LLM
                loadingText.textContent = 'Анализирую сайт с помощью AI (это может занять 1-2 минуты)...';
                const analysis = await analyzePageWithLLM(pageContent, url, currentTraffic, currentAvgCheck);

                // Сохраняем результаты
                currentAnalysis = analysis;

                // Отображаем результаты
                displayResults(analysis);

                // Скрываем загрузку
                loadingBlock.classList.remove('active');

            } catch (error) {
                console.error('Ошибка анализа:', error);
                loadingBlock.classList.remove('active');
                showError('Ошибка: ' + error.message);
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        async function fetchPageContent(url) {
            try {
                const response = await fetch('http://localhost:5000/api/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data.content;
            } catch (error) {
                console.error('Ошибка fetchPageContent:', error);
                throw new Error('Не удалось загрузить страницу: ' + error.message);
            }
        }

        async function analyzePageWithLLM(content, url, traffic, avgCheck) {
            const systemPrompt = `Ты - эксперт по маркетинговому анализу сайтов. Твоя задача - провести детальный аудит сайта и выявить критические проблемы, которые влияют на конверсию и продажи.

Анализируй сайт по следующим критериям:
1. Первое впечатление и ценностное предложение
2. Понятность продукта/услуги
3. Доверие (отзывы, гарантии, сертификаты)
4. Призывы к действию (CTA)
5. Юзабилити и навигация
6. Мобильная версия
7. Скорость загрузки (если видно проблемы в коде)
8. Контактная информация
9. Социальные доказательства
10. Ошибки и технические проблемы

Для каждой проблемы укажи:
- Серьезность (high/medium/low)
- Описание проблемы
- Влияние на конверсию (в %)
- Рекомендации по исправлению

Верни результат СТРОГО в формате JSON:
{
    "overall_summary": "Краткое резюме состояния сайта",
    "issues": [
        {
            "title": "Название проблемы",
            "severity": "high|medium|low",
            "description": "Подробное описание",
            "impact_percent": 15,
            "recommendation": "Что нужно сделать"
        }
    ]
}`;

            const userPrompt = `Проанализируй этот сайт: ${url}

${traffic > 0 ? `Текущий трафик: ${traffic} посетителей/месяц` : ''}
${avgCheck > 0 ? `Средний чек: ${avgCheck} ₽` : ''}

Содержимое страницы:
${content.substring(0, 15000)}

Проведи глубокий маркетинговый аудит и верни JSON с проблемами.`;

            try {
                const response = await fetch('http://localhost:5000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        payload: {
                            model: 'gpt-4o-mini',
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: userPrompt }
                            ],
                            temperature: 0.7,
                            max_tokens: 8192,
                            response_format: { type: 'json_object' }
                        }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                if (!data.choices || !data.choices[0]) {
                    throw new Error('Пустой ответ от API');
                }

                const resultText = data.choices[0].message.content;
                const result = JSON.parse(resultText);

                if (!result.overall_summary || !result.issues) {
                    throw new Error('Некорректный формат ответа');
                }

                return result;
            } catch (error) {
                console.error('Ошибка analyzePageWithLLM:', error);
                throw error;
            }
        }

        function displayResults(analysis) {
            // Summary
            const summaryBlock = document.getElementById('summaryBlock');
            summaryBlock.innerHTML = `
                <h2>📊 Общая оценка</h2>
                <p>${analysis.overall_summary}</p>
            `;

            // Financial Impact (если указаны трафик и средний чек)
            const financialBlock = document.getElementById('financialImpactBlock');
            if (currentTraffic > 0 && currentAvgCheck > 0) {
                const totalImpact = analysis.issues.reduce((sum, issue) => sum + (issue.impact_percent || 0), 0);
                const potentialRevenue = currentTraffic * currentAvgCheck;
                const currentLoss = potentialRevenue * (totalImpact / 100);
                const potentialGain = currentLoss;

                financialBlock.innerHTML = `
                    <div class="financial-impact">
                        <h3>💰 Финансовое влияние проблем</h3>
                        <div class="financial-stats">
                            <div class="stat-box">
                                <div class="label">Потенциальная выручка</div>
                                <div class="value">${formatMoney(potentialRevenue)}</div>
                            </div>
                            <div class="stat-box">
                                <div class="label">Текущие потери</div>
                                <div class="value">${formatMoney(currentLoss)}</div>
                            </div>
                            <div class="stat-box">
                                <div class="label">Возможный прирост</div>
                                <div class="value">${formatMoney(potentialGain)}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                financialBlock.innerHTML = '';
            }

            // Issues
            const issuesBlock = document.getElementById('issuesBlock');
            issuesBlock.innerHTML = '<h2>🔍 Выявленные проблемы</h2>';

            analysis.issues.forEach(issue => {
                const issueDiv = document.createElement('div');
                issueDiv.className = `issue ${issue.severity}`;

                issueDiv.innerHTML = `
                    <h3>
                        ${issue.title}
                        <span class="severity ${issue.severity}">${getSeverityText(issue.severity)}</span>
                    </h3>
                    <p>${issue.description}</p>
                    ${issue.impact_percent ? `<p class="impact">📉 Влияние на конверсию: -${issue.impact_percent}%</p>` : ''}
                    <div class="recommendation">
                        <strong>✅ Рекомендация:</strong>
                        <p>${issue.recommendation}</p>
                    </div>
                `;

                issuesBlock.appendChild(issueDiv);
            });

            // Показываем результаты
            document.getElementById('resultsBlock').classList.add('active');

            // Прокручиваем к результатам
            document.getElementById('resultsBlock').scrollIntoView({ behavior: 'smooth' });
        }

        function getSeverityText(severity) {
            const map = {
                'high': 'Критично',
                'medium': 'Средне',
                'low': 'Низко'
            };
            return map[severity] || severity;
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                maximumFractionDigits: 0
            }).format(amount);
        }

        function showError(message) {
            const errorBlock = document.getElementById('errorBlock');
            errorBlock.textContent = message;
            errorBlock.classList.add('active');
        }

        function hideError() {
            const errorBlock = document.getElementById('errorBlock');
            errorBlock.classList.remove('active');
        }

        function generateReport() {
            if (!currentAnalysis) {
                alert('Нет данных для формирования отчёта');
                return;
            }

            let report = `МАРКЕТИНГОВЫЙ АУДИТ САЙТА\n`;
            report += `${'='.repeat(50)}\n\n`;
            report += `URL: ${currentUrl}\n`;
            report += `Дата: ${new Date().toLocaleDateString('ru-RU')}\n\n`;

            report += `ОБЩАЯ ОЦЕНКА:\n`;
            report += `${currentAnalysis.overall_summary}\n\n`;

            if (currentTraffic > 0 && currentAvgCheck > 0) {
                const totalImpact = currentAnalysis.issues.reduce((sum, issue) => sum + (issue.impact_percent || 0), 0);
                const potentialRevenue = currentTraffic * currentAvgCheck;
                const currentLoss = potentialRevenue * (totalImpact / 100);

                report += `ФИНАНСОВОЕ ВЛИЯНИЕ:\n`;
                report += `• Трафик: ${currentTraffic.toLocaleString('ru-RU')} посетителей/месяц\n`;
                report += `• Средний чек: ${formatMoney(currentAvgCheck)}\n`;
                report += `• Потенциальная выручка: ${formatMoney(potentialRevenue)}/мес\n`;
                report += `• Текущие потери: ${formatMoney(currentLoss)}/мес\n`;
                report += `• Суммарное влияние проблем: -${totalImpact}% конверсии\n\n`;
            }

            report += `ВЫЯВЛЕННЫЕ ПРОБЛЕМЫ:\n`;
            report += `${'-'.repeat(50)}\n\n`;

            currentAnalysis.issues.forEach((issue, index) => {
                report += `${index + 1}. ${issue.title.toUpperCase()} [${getSeverityText(issue.severity)}]\n\n`;
                report += `Описание:\n${issue.description}\n\n`;
                if (issue.impact_percent) {
                    report += `Влияние на конверсию: -${issue.impact_percent}%\n\n`;
                }
                report += `Рекомендация:\n${issue.recommendation}\n\n`;
                report += `${'-'.repeat(50)}\n\n`;
            });

            report += `\nОтчёт сформирован автоматически с помощью AI Audit Tool\n`;

            // Копируем в буфер обмена
            navigator.clipboard.writeText(report).then(() => {
                alert('✅ Отчёт скопирован в буфер обмена!\n\nТеперь можете вставить его в документ для клиента.');
            }).catch(err => {
                // Если не удалось скопировать, создаём текстовый файл
                const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `audit_${new URL(currentUrl).hostname}_${new Date().toISOString().split('T')[0]}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // Enter для отправки
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeWebsite();
            }
        });
    </script>
</body>
</html>
